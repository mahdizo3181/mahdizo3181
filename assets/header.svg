<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="Mahdi Zolfaghari, Backend Developer">
  <title>Mahdi Zolfaghari, Backend Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/><stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cba6f7"/><stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#313244" stroke-width="1" opacity=".55"/>
    </pattern>
    <style>
      text{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
      .cur{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{fill-opacity:0}}
      .l1{animation:f .6s ease-out .1s both}.l2{animation:f .6s ease-out .45s both}.l3{animation:f .6s ease-out .8s both}.l4{animation:f .6s ease-out 1.1s both}
      @keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.cur,.l1,.l2,.l3,.l4{animation:none}}
    </style>
  </defs>

  <rect width="1000" height="290" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="290" rx="18" fill="url(#grid)"/>
  <path d="M18 0H982A18 18 0 0 1 1000 18V42H0V18A18 18 0 0 1 18 0Z" fill="#181825"/>
  <rect x=".5" y=".5" width="999" height="289" rx="17.5" fill="none" stroke="#45475a"/>
  <path d="M0 42H1000" stroke="#313244"/>
  <circle cx="30" cy="21" r="6" fill="#f38ba8"/><circle cx="52" cy="21" r="6" fill="#fab387"/><circle cx="74" cy="21" r="6" fill="#89b4fa"/>
  <text x="500" y="26" font-size="13" fill="#7f849c" text-anchor="middle">mahdi@dev: ~</text>

  <text x="860" y="235" font-size="170" font-weight="800" fill="url(#accent)" opacity=".10" text-anchor="middle">{ }</text>

  <text class="l1" x="44" y="92" font-size="18"><tspan fill="#fab387" font-weight="700">$</tspan><tspan fill="#9399b2"> whoami</tspan></text>
  <text class="l2" x="42" y="160" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-2">Mahdi Zolfaghari<tspan class="cur" fill="#cba6f7">_</tspan></text>
  <text class="l3" x="44" y="203" font-size="23" fill="#cba6f7" font-weight="700">Backend Developer<tspan fill="#7f849c" font-weight="400">  /  Python · Django · REST APIs</tspan></text>
  <text class="l4" x="44" y="252" font-size="15"><tspan fill="#fab387" font-weight="700">$</tspan><tspan fill="#7f849c"> echo $STATUS  </tspan><tspan fill="#f9e2af">open to new backend roles</tspan></text>
</svg>
