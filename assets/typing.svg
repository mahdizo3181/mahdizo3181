<svg xmlns="http://www.w3.org/2000/svg" width="760" height="56" viewBox="0 0 760 56" role="img" aria-label="Django backends for payments and pricing. Chunked uploads for large files. Moodle, BigBlueButton and payment gateway integrations. Clean code the next person can read.">
  <style>
    text{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:19px}
    .p{opacity:0;animation:s 12s infinite}
    .p2{animation-delay:3s}.p3{animation-delay:6s}.p4{animation-delay:9s}
    @keyframes s{0%{opacity:0;transform:translateY(6px)}4%{opacity:1;transform:none}22%{opacity:1;transform:none}26%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}
    .c{animation:b 1.1s steps(1) infinite}
    @keyframes b{50%{fill-opacity:0}}
    @media (prefers-reduced-motion:reduce){.p{animation:none;opacity:0}.p1{opacity:1}.c{animation:none}}
  </style>
  <rect x=".5" y=".5" width="759" height="55" rx="12" fill="#1e1e2e" stroke="#45475a"/>
  <text x="26" y="35" fill="#fab387" font-weight="700">›</text>
  <g fill="#cba6f7">
    <text class="p p1" x="52" y="35">Django backends for payments and pricing</text>
    <text class="p p2" x="52" y="35">Chunked uploads for large files</text>
    <text class="p p3" x="52" y="35">Moodle, BigBlueButton and payment gateways</text>
    <text class="p p4" x="52" y="35">Clean code the next person can read</text>
  </g>
  <rect class="c" x="728" y="19" width="10" height="22" rx="2" fill="#89b4fa"/>
</svg>
